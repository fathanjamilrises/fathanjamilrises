name: Generate Snake Game

on:
  schedule:
    - cron: "0 0 * * *" # runs every day at 00:00 UTC
  workflow_dispatch: {} # allows manual run from the Actions tab
  push:
    branches:
      - main # change this to "master" if that's your default branch

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from a github user contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: fathanjamilrises
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=%23FFD60A&color_dots=%2300F5D4,%238338EC,%23FF006E,%23FFD60A

      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
